name: Lab 5 Quality Gate

on:
  push:
    paths:
      - "quality-lab5/**"
      - ".github/workflows/lab5-quality-gate.yml"
  pull_request:
    paths:
      - "quality-lab5/**"
      - ".github/workflows/lab5-quality-gate.yml"

jobs:

  # 1. Ruff + pytest
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quality-lab5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: |
          pytest tests/unit --cov=src --cov-report=term-missing --cov-report=html
          
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: quality-lab5/htmlcov/


  # 2. E2E - Python Playwright
  e2e-tests:
    runs-on: ubuntu-latest
    needs: python-tests

    strategy:
      matrix:
        browser: [chromium, firefox, webkit]

    defaults:
      run:
        working-directory: quality-lab5

    env:
      PW_BROWSER: ${{ matrix.browser }}
      BASE_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Start FastAPI
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/ && break
            sleep 1
          done

      - name: Run E2E tests
        run: pytest tests/e2e -v


  # 3. Lighthouse CI
  lighthouse:
    runs-on: ubuntu-latest
    needs: python-tests

    defaults:
      run:
        working-directory: quality-lab5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx lhci autorun

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: quality-lab5/.lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn


  # 4. Summary
  quality-gate:
    runs-on: ubuntu-latest
    needs: [python-tests, e2e-tests, lighthouse]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Python: ${{ needs.python-tests.result }}"
          echo "E2E: ${{ needs.e2e-tests.result }}"
          echo "Lighthouse: ${{ needs.lighthouse.result }}"

          if [[ "${{ needs.python-tests.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-tests.result }}" != "success" ]] || \
             [[ "${{ needs.lighthouse.result }}" != "success" ]]; then
            echo "QUALITY GATE FAILED"
            exit 1
          fi

          echo "QUALITY GATE PASSED"

  # 5. Reports
  deploy-reports:
    runs-on: ubuntu-latest
    needs: [e2e-tests, lighthouse]
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts