name: Lab 5 Quality Gate

on:
  push:
    paths:
      - "quality-lab5/**"
      - ".github/workflows/lab5-quality-gate.yml"
    branches:
      - master
  pull_request:
    paths:
      - "quality-lab5/**"
      - ".github/workflows/lab5-quality-gate.yml"
    branches:
      - master

  schedule:
    - cron: "45 15 * * *"

  workflow_dispatch:

jobs:

  # 1. Ruff + pytest
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quality-lab5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: |
          pytest tests/unit --cov=src --cov-report=term-missing --cov-report=html
          
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: quality-lab5/htmlcov/


  # 2. E2E - Python Playwright
  e2e-tests:
    runs-on: ubuntu-latest
    needs: python-tests

    strategy:
      matrix:
        browser: [chromium, firefox, webkit]

    defaults:
      run:
        working-directory: quality-lab5

    env:
      PW_BROWSER: ${{ matrix.browser }}
      BASE_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Start FastAPI
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/ && break
            sleep 1
          done

      - name: Run E2E tests
        run: pytest tests/e2e -v


  # 3. Lighthouse CI
  lighthouse:
    runs-on: ubuntu-latest
    needs: python-tests

    defaults:
      run:
        working-directory: quality-lab5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update npm
        run: npm install -g npm@11.19.0

      - name: Check npm version
        run: npm -v

      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx lhci autorun

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: quality-lab5/.lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn


  # 4. Visual regression tests - Chromatic
  visual-tests:
    runs-on: ubuntu-latest
    needs: python-tests

    defaults:
      run:
        working-directory: quality-lab5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update npm
        run: npm install -g npm@11.19.0

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual Playwright tests
        run: npm run test:visual

      - name: Run Chromatic
        run: npm run chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}


  # 5. Summary
  quality-gate:
    runs-on: ubuntu-latest
    needs: [python-tests, e2e-tests, lighthouse, visual-tests]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Python: ${{ needs.python-tests.result }}"
          echo "E2E: ${{ needs.e2e-tests.result }}"
          echo "Lighthouse: ${{ needs.lighthouse.result }}"
          echo "Visual tests: ${{ needs.visual-tests.result }}"

          if [[ "${{ needs.python-tests.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-tests.result }}" != "success" ]] || \
             [[ "${{ needs.lighthouse.result }}" != "success" ]] || \
             [[ "${{ needs.visual-tests.result }}" != "success" ]]; then
            echo "QUALITY GATE FAILED"
            exit 1
          fi

          echo "QUALITY GATE PASSED"

  # 6. Reports
  deploy-reports:
    runs-on: ubuntu-latest
    needs: [e2e-tests, lighthouse]
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts


  # 7. Nightly email report
  email-report:
    runs-on: ubuntu-latest

    needs: [python-tests, e2e-tests, lighthouse, visual-tests, quality-gate, deploy-reports]

    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Send report by email
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

          REPORT_SUBJECT: "Quality Gate: ${{ needs.quality-gate.result }}"

          REPORT_BODY: |
            Quality Gate report

            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}

            Python tests: ${{ needs.python-tests.result }}
            E2E tests: ${{ needs.e2e-tests.result }}
            Lighthouse: ${{ needs.lighthouse.result }}
            Visual tests: ${{ needs.visual-tests.result }}
            Quality Gate: ${{ needs.quality-gate.result }}
            Reports deployment: ${{ needs.deploy-reports.result }}

            Full report:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        run: python quality-lab5/send_report.py
